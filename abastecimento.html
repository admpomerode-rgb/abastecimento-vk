<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a3350">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Abastecimento VK</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#eaf1f3;--card:#fff;--tx:#0b1f2a;--soft:#5b6b76;--bd:#d3dee4;--ac:#0f6b47;--ac2:#0a3350;--mint:#7eebbe;--ac-tx:#fff;--ok:#15803d;--warn:#b45309;--bad:#dc2626;--grad:linear-gradient(135deg,#2b6b5d 0%,#0a3350 100%);--sombra:0 10px 28px -14px rgba(10,51,80,.45);--campo:#f5f9fa}
@media (prefers-color-scheme:dark){:root{--bg:#06131b;--card:#0e2230;--tx:#eaf3f7;--soft:#93abb9;--bd:#1f3b4d;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--sombra:0 10px 28px -14px rgba(0,0,0,.7);--campo:#0a1b27}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--bg) radial-gradient(circle at 100% 0%,rgba(43,107,93,.14),transparent 45%) fixed}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
.sub{color:var(--soft);font-size:14px}
.topo{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}
.topo img{width:48px;height:48px;border-radius:13px;box-shadow:var(--sombra)}
.topo .sub{margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sombra)}
.card h3{margin:0 0 6px;font-size:15px;letter-spacing:.02em}
label{display:block;font-size:12.5px;color:var(--soft);margin:14px 0 6px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
input,select{width:100%;font-size:22px;padding:12px 14px;border-radius:14px;border:2px solid var(--bd);background:var(--campo);color:var(--tx);min-height:56px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px rgba(15,107,71,.16)}
.pre,.pw{position:relative}
.pre b{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--soft);font-weight:700;pointer-events:none}
.pre input{padding-left:56px;font-size:30px;font-weight:700;min-height:68px;font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
.btn{display:block;width:100%;min-height:62px;font-size:19px;font-weight:800;border-radius:16px;border:0;background:var(--grad);color:#fff;margin-top:16px;cursor:pointer;box-shadow:0 10px 22px -10px rgba(10,51,80,.7);letter-spacing:.01em}
.btn:active{transform:scale(.985)}
.btn.sec{background:transparent;color:var(--tx);border:2px solid var(--bd);box-shadow:none}
.btn.ruim{background:var(--bad)}
.btn:disabled{opacity:.5}
.veic{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;color:var(--tx);font-size:19px;font-weight:700;min-height:84px;cursor:pointer;box-shadow:var(--sombra)}
.veic:active{transform:scale(.985)}
.veic .ic{width:54px;height:54px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.veic .tx{flex:1;min-width:0}
.veic small{display:block;font-weight:500;color:var(--soft);font-size:13.5px;margin-top:4px}
.veic .seta{font-size:26px;color:var(--soft)}
.placa{white-space:nowrap;font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.06em;border:1px solid var(--bd);background:var(--campo);border-radius:6px;padding:0 6px;font-size:12.5px;margin-right:6px}
.faixa{background:var(--grad);color:#fff;border-radius:22px;padding:16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--sombra);position:relative;overflow:hidden}
.faixa::after{content:'';position:absolute;right:-30px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.faixa .ic{width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:27px;flex-shrink:0;z-index:1}
.faixa .tx{flex:1;min-width:0;z-index:1}
.faixa .peq{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.faixa b{font-size:21px;display:block;margin-top:1px}
.faixa .info{font-size:13px;opacity:.85;margin-top:3px}
.faixa .placa{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.faixa button{background:#fff;color:#0a3350;border:0;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:800;z-index:1;cursor:pointer}
.row{display:flex;gap:10px} .row>div{flex:1;min-width:0}
.calc{margin-top:10px;font-size:14.5px;font-weight:700;color:var(--ok);background:rgba(21,128,61,.1);border-radius:10px;padding:8px 12px;display:none}
.calc:not(:empty){display:block}
.sw{display:flex;align-items:center;justify-content:space-between;background:var(--campo);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;min-height:58px;margin-top:14px;cursor:pointer;font-weight:700}
.sw .bola{width:54px;height:32px;border-radius:99px;background:var(--bd);position:relative;transition:.15s} .sw .bola::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)} .sw.on .bola{background:var(--ok)} .sw.on .bola::after{left:25px}
.hist{border-top:1px solid var(--bd);padding:12px 0;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.hist:first-of-type{border-top:0}
.hist b.dt{font-size:15px}
.tag{font-size:11.5px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap;display:inline-block}
.t-novo{color:var(--warn);background:rgba(217,119,6,.14)} .t-importado{color:var(--ok);background:rgba(21,128,61,.14)} .t-erro,.t-sem_conta{color:var(--bad);background:rgba(220,38,38,.12)}
.off{background:#fde68a;color:#451a03;border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:12px;font-weight:700}
#modal{position:fixed;inset:0;background:rgba(3,14,21,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:50;backdrop-filter:blur(3px)}
#modal.on{display:flex} #modal .box{background:var(--card);border-radius:24px;padding:22px;max-width:440px;width:100%;border-top:8px solid var(--warn);box-shadow:0 24px 60px -20px rgba(0,0,0,.6)}
#modal.erro .box{border-top-color:var(--bad)} #modal.ok .box{border-top-color:var(--ok)}
#modal .ico{font-size:34px;line-height:1;margin-bottom:6px}
#modal h2{margin:0 0 8px;font-size:22px} #modal p{font-size:17.5px;line-height:1.45;margin:6px 0 4px;white-space:pre-line}
.min{font-size:13.5px;color:var(--soft);text-align:center;margin-top:18px}
.min a{color:var(--soft)}
.vazio{text-align:center;padding:26px 14px;color:var(--soft);font-size:15px;line-height:1.5}
.vazio .big{font-size:40px;display:block;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"><div class="box"><div class="ico" id="mIco"></div><h2 id="mTit"></h2><p id="mTxt"></p><div id="mBtns"></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
/* Abastecimento VK — app rápido do carro. Grava em "abastecimentos_app" (mesmo Firebase do Livro Caixa);
   o Livro Caixa importa para o módulo Carros e cria o lançamento financeiro. */
const LIMITE_SEM_USO_MS = 30*24*60*60*1000; // 30 dias sem abrir → pede a senha de novo (mude aqui se quiser)
function marcarUso(){ try{ localStorage.setItem('abast_ultimo_uso', String(Date.now())); }catch(e){} }
function usoExpirou(){ try{ const t=Number(localStorage.getItem('abast_ultimo_uso')||0); return t>0 && (Date.now()-t)>LIMITE_SEM_USO_MS; }catch(e){ return false; } }
const CONFIG = { apiKey:"AIzaSyBbSv3c_UKvhi3Qm0V0Nw3n4bU-sCKaarE", authDomain:"financeiro-livro-caixa.firebaseapp.com", projectId:"financeiro-livro-caixa", storageBucket:"financeiro-livro-caixa.firebasestorage.app", messagingSenderId:"515159506710", appId:"1:515159506710:web:c41985f0febd4a717b5a37" };
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = s=>{ if(typeof s==='number') return s; s=String(s==null?'':s).trim().replace(/\s/g,''); if(!s) return 0; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=Number(s); return Number.isFinite(n)?n:NaN; };
const hoje = ()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const dataBR = iso=>iso?iso.split('-').reverse().join('/'):'';
const r2 = x=>Math.round((x+Number.EPSILON)*100)/100;
const uuid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));

let auth, db, usuario=null, veiculos=[], meus=[], veiculo=null, unsubV=null, unsubM=null, offline=!navigator.onLine;
const LS = { get:k=>{ try{return localStorage.getItem(k);}catch(e){return null;} }, set:(k,v)=>{ try{localStorage.setItem(k,v);}catch(e){} } };

/* ---------- avisos grandes (nunca toast pequeno) ---------- */
function aviso({titulo,texto,tipo,botoes}){
  return new Promise(res=>{
    const m=$('#modal'); m.className='on '+(tipo||''); $('#mIco').textContent=({erro:'⛔',ok:'✅'}[tipo]||'⚠️'); $('#mTit').textContent=titulo||''; $('#mTxt').textContent=texto||'';
    const b=$('#mBtns'); b.innerHTML='';
    (botoes||[{t:'OK',v:true}]).forEach(x=>{ const e=document.createElement('button'); e.className='btn '+(x.cls||''); e.textContent=x.t; e.onclick=()=>{ m.className=''; res(x.v); }; b.appendChild(e); });
  });
}
const erro = (t,x)=>aviso({titulo:t,texto:x,tipo:'erro'});
const confirmar = (t,x,ok='Sim, é isso',nao='Voltar e corrigir')=>aviso({titulo:t,texto:x,botoes:[{t:ok,v:true},{t:nao,v:false,cls:'sec'}]});

/* ---------- início ---------- */
function iniciar(){
  if(typeof firebase==='undefined'){ $('#app').innerHTML='<div class="card"><h1>Sem internet</h1><p>Abra o app uma vez com internet para carregar. Depois ele funciona mesmo sem sinal.</p></div>'; return; }
  firebase.initializeApp(CONFIG); auth=firebase.auth(); db=firebase.firestore();
  try{ auth.setPersistence('local'); }catch(e){}   // login fica salvo no aparelho

  db.settings({ experimentalAutoDetectLongPolling:true, cacheSizeBytes:firebase.firestore.CACHE_SIZE_UNLIMITED });
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  window.addEventListener('online',()=>{ offline=false; desenhar(); }); window.addEventListener('offline',()=>{ offline=true; desenhar(); });
  auth.onAuthStateChanged(u=>{ if(u && usoExpirou()){ auth.signOut(); return; } if(u) marcarUso(); usuario=u; if(u) assinar(); else { if(unsubV)unsubV(); if(unsubM)unsubM(); veiculos=[]; meus=[]; } desenhar(); });
}
function assinar(){
  if(unsubV) unsubV(); if(unsubM) unsubM();
  unsubV = db.collection('veiculos_app').onSnapshot(s=>{ veiculos=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')); const sel=LS.get('veiculoId'); if(!veiculo && sel){ const v=veiculos.find(x=>x.id===sel); if(v) veiculo=v; } else if(veiculo){ veiculo=veiculos.find(x=>x.id===veiculo.id)||null; } desenhar(); }, e=>console.error(e));
  unsubM = db.collection('abastecimentos_app').where('uid','==',usuario.uid).onSnapshot(s=>{ meus=s.docs.map(d=>({id:d.id,pendente:d.metadata.hasPendingWrites,...d.data()})).sort((a,b)=>String(b.criadoEm).localeCompare(String(a.criadoEm))).slice(0,12); if(!formAberto()) desenhar(); }, e=>console.error(e));
}
const formAberto = ()=>false;

/* ---------- telas ---------- */
function desenhar(){
  const app=$('#app'); if(!app) return;
  { const le=document.getElementById('lEmail'), ls=document.getElementById('lSenha');   // tela de login aberta: não apaga o que você está digitando
    if(le && ls && !usuario && !desenhar.forcar && (le.value || ls.value || document.activeElement===le || document.activeElement===ls)) return; }
  if(document.getElementById('fValor') && ['fValor','fLitros','fKm'].some(i=>document.getElementById(i).value) && veiculo && !desenhar.forcar) return;   // não apaga o que você está digitando
  const aviso_off = offline ? '<div class="off">📵 Sem sinal. Pode registrar: fica guardado no aparelho e é enviado quando o sinal voltar.</div>' : '';
  if(!usuario){
    app.innerHTML = `<div class="topo"><img src="icon-192.png" alt=""><div><h1>Abastecimento VK</h1><div class="sub">Registro rápido no carro</div></div></div>${aviso_off}<div class="card"><h3>Entrar</h3><div class="sub">Use o mesmo e-mail e senha do Livro Caixa.</div><label>E-mail</label><input id="lEmail" type="email" placeholder="seu@email.com"><label>Senha</label><div class="pw"><input id="lSenha" type="password" placeholder="senha" style="padding-right:64px"><button type="button" id="bOlho" aria-label="Mostrar senha" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:24px;padding:8px;cursor:pointer">👁️</button></div><button class="btn" id="bEntrar">Entrar</button></div>`;
    $('#bOlho').onclick=()=>{ const i=$('#lSenha'), ver=i.type==='password'; i.type=ver?'text':'password'; $('#bOlho').textContent=ver?'🙈':'👁️'; $('#bOlho').setAttribute('aria-label',ver?'Esconder senha':'Mostrar senha'); i.focus(); };
    $('#bEntrar').onclick=entrar; $('#lSenha').onkeydown=e=>{ if(e.key==='Enter') entrar(); }; return;
  }
  if(!veiculo){
    const icoV = v=>/moto|cg|biz|xre|titan|fan|pop|bros|fazer|factor|lander|tenere/i.test((v.nome||'')+' '+(v.modelo||''))?'🏍️':'🚗';
    app.innerHTML = `<div class="topo"><img src="icon-192.png" alt=""><div><h1>Qual veículo?</h1><div class="sub">Toque no que você vai abastecer</div></div></div>${aviso_off}${veiculos.length?veiculos.map(v=>`<button class="veic" data-v="${esc(v.id)}"><span class="ic">${icoV(v)}</span><span class="tx">${esc(v.nome)}<small><span class="placa">${esc(v.placa||'sem placa')}</span>último km ${(v.kmAtual||0).toLocaleString('pt-BR')}</small></span><span class="seta">›</span></button>`).join(''):'<div class="card vazio"><span class="big">📡</span>Nenhum veículo disponível ainda.<br>Abra o Livro Caixa uma vez (ele envia a lista de veículos para cá) e volte.</div>'}<div class="min"><a href="#" id="bSair">Sair da conta</a></div>`;
    app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ veiculo=veiculos.find(x=>x.id===b.dataset.v); LS.set('veiculoId',veiculo.id); desenhar(); });
    $('#bSair').onclick=e=>{ e.preventDefault(); sair(); }; return;
  }
  const v=veiculo; const combs=(v.combustiveis&&v.combustiveis.length)?v.combustiveis:['Gasolina comum','Etanol','Diesel S10'];
  const comb0=LS.get('comb_'+v.id)||v.ultimoCombustivel||combs[0]; const posto0=LS.get('posto_'+v.id)||v.ultimoPosto||'';
  const icoV2 = /moto|cg|biz|xre|titan|fan|pop|bros|fazer|factor|lander|tenere/i.test((v.nome||'')+' '+(v.modelo||''))?'🏍️':'🚗';
  app.innerHTML = `${aviso_off}<div class="faixa"><div class="ic">${icoV2}</div><div class="tx"><div class="peq">Abastecendo</div><b>${esc(v.nome)}</b><div class="info">${v.placa?`<span class="placa">${esc(v.placa)}</span>`:''}<span style="white-space:nowrap">último km ${(v.kmAtual||0).toLocaleString('pt-BR')}</span></div></div><button id="bTroca">Trocar</button></div>
  <div class="card">
    <label style="margin-top:0">Valor pago</label><div class="pre"><b>R$</b><input id="fValor" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
    <div class="row"><div><label>Litros</label><input id="fLitros" inputmode="decimal" placeholder="0,00" autocomplete="off"></div><div><label>Preço do litro</label><input id="fPreco" inputmode="decimal" placeholder="auto" autocomplete="off"></div></div>
    <div class="calc" id="fCalc"></div>
    <label>Km do painel agora</label><input id="fKm" inputmode="numeric" placeholder="${(v.kmAtual||0)||''}" autocomplete="off">
    <label>Combustível</label><select id="fComb">${combs.map(c=>`<option ${c===comb0?'selected':''}>${esc(c)}</option>`).join('')}</select>
    <label>Posto</label><input id="fPosto" list="dlPostos" value="${esc(posto0)}" autocomplete="off" placeholder="nome do posto"><datalist id="dlPostos">${(v.postos||[]).map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
    <div class="sw on" id="fCheio"><span>⛽ Encheu o tanque?</span><span class="bola"></span></div>
    <label>Data</label><input id="fData" type="date" value="${hoje()}" max="${hoje()}">
    <button class="btn" id="bSalvar">✔ Registrar abastecimento</button>
  </div>
  <div class="card"><h3>🕘 Meus últimos registros</h3>${meus.length?meus.map(m=>`<div class="hist"><span><b class="dt">${dataBR(m.data)}</b> · ${esc(m.veiculoNome||'')}<br><small style="color:var(--soft)">${brl(m.valor)} · ${(m.litros||0).toLocaleString('pt-BR')} L · ${(m.km||0).toLocaleString('pt-BR')} km</small>${m.erro?`<br><small style="color:var(--bad)">${esc(m.erro)}</small>`:''}</span><span style="text-align:right"><span class="tag t-${m.status}">${m.pendente?'Guardado no aparelho':({novo:'Enviado',importado:'No financeiro ✓',erro:'Precisa revisar',sem_conta:'Aguardando o financeiro'}[m.status]||m.status)}</span>${m.status==='novo'?`<br><a href="#" data-del="${esc(m.id)}" style="font-size:13px;color:var(--bad);display:inline-block;margin-top:6px">apagar</a>`:''}</span></div>`).join(''):'<div class="vazio"><span class="big">⛽</span>Nenhum registro ainda.<br>O primeiro vai aparecer aqui.</div>'}</div>
  <div class="min"><a href="#" id="bSair">Sair da conta</a></div>`;
  $('#bTroca').onclick=()=>{ veiculo=null; LS.set('veiculoId',''); desenhar.forcar=true; desenhar(); desenhar.forcar=false; };
  $('#bSair').onclick=e=>{ e.preventDefault(); sair(); };
  const cheio=$('#fCheio'); cheio.onclick=()=>cheio.classList.toggle('on');
  const calc=()=>{ const val=num($('#fValor').value), lit=num($('#fLitros').value); let p=num($('#fPreco').value);
    if(val>0&&lit>0&&!($('#fPreco').dataset.manual)){ $('#fPreco').value=(val/lit).toFixed(3).replace('.',','); p=val/lit; }
    $('#fCalc').textContent = (val>0&&lit>0)?`Preço por litro: ${brl(val/lit)}`:''; };
  ['fValor','fLitros'].forEach(i=>$('#'+i).oninput=calc); $('#fPreco').oninput=e=>{ e.target.dataset.manual=e.target.value?'1':''; };
  document.querySelectorAll('[data-del]').forEach(a=>a.onclick=async e=>{ e.preventDefault(); if(await confirmar('Apagar este registro?','Ele ainda não entrou no financeiro. Apague só se foi lançado por engano.','Apagar','Não apagar')) db.collection('abastecimentos_app').doc(a.dataset.del).delete().catch(x=>erro('Não consegui apagar',x.message)); });
  $('#bSalvar').onclick=salvar;
}
async function entrar(){
  const e=$('#lEmail').value.trim(), s=$('#lSenha').value; if(!e||!s){ await erro('Faltou algo','Digite o e-mail e a senha.'); return; }
  const b=$('#bEntrar'); b.disabled=true; b.textContent='Entrando…';
  marcarUso(); try{ await auth.signInWithEmailAndPassword(e,s); }catch(x){ b.disabled=false; b.textContent='Entrar'; await erro('Não consegui entrar', /network/i.test(x.code||x.message)?'Sem internet. Tente de novo quando tiver sinal.':'E-mail ou senha incorretos.'); }
}
function sair(){ confirmar('Sair da conta?','Você vai precisar entrar de novo.','Sair','Ficar').then(ok=>{ if(ok){ LS.set('veiculoId',''); veiculo=null; auth.signOut(); } }); }

/* ---------- salvar (com conferências grandes, para não registrar número errado) ---------- */
let salvando=false;
async function salvar(){
  if(salvando) return; const v=veiculo;
  const valor=num($('#fValor').value), litros=num($('#fLitros').value), km=num($('#fKm').value), data=$('#fData').value;
  let preco=num($('#fPreco').value); const comb=$('#fComb').value, posto=$('#fPosto').value.trim(), cheio=$('#fCheio').classList.contains('on');
  if(!(valor>0)) return erro('Falta o valor','Digite quanto você pagou, em reais.');
  if(!(litros>0)) return erro('Faltam os litros','Digite quantos litros entraram.');
  if(!(km>0)) return erro('Falta o km','Digite o km que aparece no painel agora.');
  if(!data) return erro('Falta a data','Escolha a data do abastecimento.');
  if(data>hoje()) return erro('Data no futuro','A data não pode ser depois de hoje.');
  const calcP=valor/litros; if(!(preco>0)) preco=calcP;
  if(Math.abs(preco-calcP)>0.05 && !(await confirmar('Preço do litro diferente','Valor ÷ litros dá '+brl(calcP)+' por litro, mas você digitou '+brl(preco)+'.\nVou usar '+brl(calcP)+'. Está certo?'))) return;
  if(calcP<2||calcP>15) if(!(await confirmar('Preço do litro estranho', 'Deu '+brl(calcP)+' por litro ('+brl(valor)+' ÷ '+litros.toLocaleString('pt-BR')+' L).\nConfira se não digitou valor ou litros errado.','Está certo, registrar'))) return;
  if(v.kmAtual && km<v.kmAtual) if(!(await confirmar('Km menor que o último','Você digitou '+km.toLocaleString('pt-BR')+' km, mas o último registrado foi '+v.kmAtual.toLocaleString('pt-BR')+' km.\nO km do painel só sobe. Confira.','Está certo, registrar'))) return;
  if(v.kmAtual && km-v.kmAtual>3000) if(!(await confirmar('Muito km desde o último','Foram '+(km-v.kmAtual).toLocaleString('pt-BR')+' km desde o último registro ('+v.kmAtual.toLocaleString('pt-BR')+').\nConfira se digitou o km certo.','Está certo, registrar'))) return;
  // confirmação explícita do veículo (regra do Livro Caixa)
  if(!(await confirmar('Confirma o veículo?', v.nome+(v.placa?' — '+v.placa:'')+'\n'+brl(valor)+' · '+litros.toLocaleString('pt-BR')+' L · '+km.toLocaleString('pt-BR')+' km','Sim, este carro','Voltar'))) return;
  salvando=true; $('#bSalvar').disabled=true;
  const id=uuid();
  const doc={ id, veiculoId:v.id, veiculoNome:v.nome, veiculoConfirmado:true, data, km:Math.round(km), litros:r2(litros), valor:r2(valor), precoLitro:r2(valor/litros), tipoCombustivel:comb, posto, tanqueCheio:cheio, status:'novo', email:usuario.email, uid:usuario.uid, criadoEm:new Date().toISOString() };
  LS.set('comb_'+v.id,comb); LS.set('posto_'+v.id,posto);
  // set() só conclui quando o servidor confirma; sem sinal ele fica guardado no aparelho e sobe sozinho depois
  const p=db.collection('abastecimentos_app').doc(id).set(doc);
  p.catch(e=>erro('Não consegui enviar','O registro ficou guardado no aparelho. Motivo: '+(e.message||e)));
  await Promise.race([p.catch(()=>{}), new Promise(r=>setTimeout(r,1500))]);
  salvando=false;
  veiculo = Object.assign({},v,{kmAtual:Math.max(v.kmAtual||0,Math.round(km))});
  desenhar.forcar=true;
  await aviso({titulo:'✔ Registrado!',tipo:'ok',texto:offline?'Sem sinal agora. Ficou guardado no aparelho e vai sozinho quando o sinal voltar.':brl(valor)+' · '+litros.toLocaleString('pt-BR')+' L · '+km.toLocaleString('pt-BR')+' km\nO Livro Caixa lança no financeiro na próxima sincronização.'});
  desenhar();
  desenhar.forcar=false;
}
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
iniciar();
</script>
